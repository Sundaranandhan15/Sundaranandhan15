<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020818"/>
      <stop offset="50%" stop-color="#0a0f2e"/>
      <stop offset="100%" stop-color="#050224"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="75%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#7b1fa2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7b1fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="60%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#00bcd4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- BG -->
  <rect width="900" height="320" fill="url(#bgGrad)" rx="14"/>
  <rect width="900" height="320" fill="url(#glowBlue)" rx="14"/>
  <rect width="900" height="320" fill="url(#glowPurple)" rx="14"/>
  <rect width="900" height="320" fill="url(#glowCyan)" rx="14"/>

  <!-- Subtle grid -->
  <g stroke="#1a2a5e" stroke-width="0.4" opacity="0.35">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="540" y1="0" x2="540" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
  </g>

  <!-- Animated circuit lines -->
  <g stroke="#1565c0" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M0,200 H80 V140 H200 V160 H320">
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M900,100 H780 V140 H660 V120 H560">
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="4s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M0,280 H120 V240 H240">
      <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M900,260 H760 V220 H640 V240 H540">
      <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    </path>
  </g>

  <!-- Floating orbs -->
  <circle cx="60" cy="260" r="10" fill="#1565c0" filter="url(#glow8)" opacity="0.0">
    <animate attributeName="opacity" values="0;0.8;0.5;0.8;0" dur="7s" repeatCount="indefinite"/>
    <animateMotion dur="7s" repeatCount="indefinite" path="M0,0 Q8,-60 0,-130 Q-8,-60 0,0"/>
  </circle>
  <circle cx="840" cy="280" r="8" fill="#7b1fa2" filter="url(#glow8)" opacity="0.0">
    <animate attributeName="opacity" values="0;0.7;0.4;0.7;0" dur="9s" repeatCount="indefinite" begin="1s"/>
    <animateMotion dur="9s" repeatCount="indefinite" begin="1s" path="M0,0 Q-6,-50 0,-110 Q6,-50 0,0"/>
  </circle>
  <circle cx="450" cy="300" r="7" fill="#00bcd4" filter="url(#glow8)" opacity="0.0">
    <animate attributeName="opacity" values="0;0.6;0.9;0.6;0" dur="6s" repeatCount="indefinite" begin="2s"/>
    <animateMotion dur="6s" repeatCount="indefinite" begin="2s" path="M0,0 Q10,-55 0,-110 Q-10,-55 0,0"/>
  </circle>

  <!-- Small floating particles -->
  <g fill="#4fc3f7">
    <circle cx="100" cy="290" r="2"><animateMotion dur="8s" repeatCount="indefinite" path="M0,0 Q5,-70 0,-140 Q-5,-70 0,0"/><animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="300" r="1.5"><animateMotion dur="6s" repeatCount="indefinite" begin="1s" path="M0,0 Q4,-55 0,-110 Q-4,-55 0,0"/><animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="380" cy="310" r="2"><animateMotion dur="10s" repeatCount="indefinite" begin="0.5s" path="M0,0 Q7,-80 0,-160 Q-7,-80 0,0"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="520" cy="290" r="1.5"><animateMotion dur="7s" repeatCount="indefinite" begin="3s" path="M0,0 Q-5,-60 0,-120 Q5,-60 0,0"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite" begin="3s"/></circle>
    <circle cx="680" cy="300" r="2.5"><animateMotion dur="9s" repeatCount="indefinite" begin="1.5s" path="M0,0 Q6,-70 0,-140 Q-6,-70 0,0"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite" begin="1.5s"/></circle>
    <circle cx="800" cy="290" r="1.5"><animateMotion dur="5s" repeatCount="indefinite" begin="2.5s" path="M0,0 Q-4,-45 0,-90 Q4,-45 0,0"/><animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite" begin="2.5s"/></circle>
  </g>
  <g fill="#ce93d8">
    <circle cx="160" cy="280" r="1.5"><animateMotion dur="7s" repeatCount="indefinite" begin="0.8s" path="M0,0 Q3,-50 0,-100 Q-3,-50 0,0"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="740" cy="295" r="2"><animateMotion dur="8s" repeatCount="indefinite" begin="2s" path="M0,0 Q-6,-65 0,-130 Q6,-65 0,0"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite" begin="2s"/></circle>
  </g>

  <!-- ── MAIN NAME ── jumps in from below, then floats -->
  <g>
    <!-- Jump-in animation on name -->
    <text x="450" y="140" font-family="'Courier New',Courier,monospace" font-size="38" font-weight="900"
          fill="#4fc3f7" text-anchor="middle" letter-spacing="3" filter="url(#glow4)" opacity="0">
      SUNDARANANDHAN R J
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.3s"/>
      <animate attributeName="y" values="200;120;145;135;140" dur="0.9s" fill="freeze" begin="0.3s"
               calcMode="spline" keySplines="0.2 0 0.8 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </text>
    <!-- Glow copy -->
    <text x="450" y="140" font-family="'Courier New',Courier,monospace" font-size="38" font-weight="900"
          fill="#4fc3f7" text-anchor="middle" letter-spacing="3" filter="url(#glow8)" opacity="0" style="opacity:0.45">
      SUNDARANANDHAN R J
      <animate attributeName="opacity" values="0;0.45" dur="0.5s" fill="freeze" begin="0.3s"/>
      <animate attributeName="y" values="200;120;145;135;140" dur="0.9s" fill="freeze" begin="0.3s"
               calcMode="spline" keySplines="0.2 0 0.8 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </text>
    <!-- Continuous float after entry -->
    <animateMotion dur="4.5s" begin="1.2s" repeatCount="indefinite"
      path="M0,0 Q0,-8 0,-14 Q0,-8 0,0"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </g>

  <!-- Cursor blink -->
  <rect x="646" y="112" width="3" height="30" fill="#4fc3f7" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0" dur="1.2s" repeatCount="indefinite" begin="1.2s"/>
    <animateMotion dur="4.5s" begin="1.2s" repeatCount="indefinite" path="M0,0 Q0,-8 0,-14 Q0,-8 0,0"/>
  </rect>

  <!-- Subtitle -->
  <text x="450" y="174" font-family="'Courier New',Courier,monospace" font-size="13.5" fill="#90caf9"
        text-anchor="middle" letter-spacing="1.5" opacity="0">
    Final Year B.Tech · CSE AI&amp;ML '27 · SRMIST · Ex ML Intern @ NIT Trichy
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="1.1s"/>
    <animateMotion dur="4.5s" begin="1.4s" repeatCount="indefinite" path="M0,0 Q0,-6 0,-10 Q0,-6 0,0"/>
  </text>

  <!-- Animated pills -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1.5s"/>
    <animateMotion dur="4.5s" begin="1.7s" repeatCount="indefinite" path="M0,0 Q0,-5 0,-9 Q0,-5 0,0"/>

    <rect x="138" y="200" width="148" height="24" rx="12" fill="#0d47a1" stroke="#1565c0" stroke-width="0.8"/>
    <text x="212" y="216" font-family="monospace" font-size="11.5" fill="#90caf9" text-anchor="middle">AI &amp; ML Engineer 🤖</text>

    <rect x="300" y="200" width="138" height="24" rx="12" fill="#4a148c" stroke="#7b1fa2" stroke-width="0.8"/>
    <text x="369" y="216" font-family="monospace" font-size="11.5" fill="#ce93d8" text-anchor="middle">Python Developer 🐍</text>

    <rect x="452" y="200" width="152" height="24" rx="12" fill="#1b5e20" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="528" y="216" font-family="monospace" font-size="11.5" fill="#a5d6a7" text-anchor="middle">NIT Trichy Intern 🎓</text>

    <rect x="618" y="200" width="144" height="24" rx="12" fill="#e65100" stroke="#bf360c" stroke-width="0.8"/>
    <text x="690" y="216" font-family="monospace" font-size="11.5" fill="#ffe0b2" text-anchor="middle">SDG 4 Builder 🌍</text>
  </g>

  <!-- Divider line animated -->
  <line x1="80" y1="248" x2="820" y2="248" stroke="#1565c0" stroke-width="0.8" opacity="0.4"
        stroke-dasharray="0,740">
    <animate attributeName="stroke-dasharray" values="0,740;740,0" dur="1.2s" fill="freeze" begin="2s"/>
  </line>

  <!-- Bottom subtitle -->
  <text x="450" y="272" font-family="monospace" font-size="11" fill="#546e7a"
        text-anchor="middle" letter-spacing="2" opacity="0">
    ── EduAI · AgroV · ResumeIQ · GIS Optimizer · Machine Health Monitor ──
    <animate attributeName="opacity" values="0;0.75" dur="0.8s" fill="freeze" begin="2.2s"/>
  </text>

  <!-- Floating tech badges -->
  <g opacity="0.0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="14s" repeatCount="indefinite" begin="3s"/>
    <animateMotion dur="14s" repeatCount="indefinite" begin="3s" path="M40,300 Q50,260 40,220 Q30,180 40,150"/>
    <rect x="-32" y="-11" width="64" height="22" rx="5" fill="#0d47a1" stroke="#1565c0" stroke-width="0.6"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#90caf9" text-anchor="middle">FastAPI</text>
  </g>
  <g opacity="0.0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="16s" repeatCount="indefinite" begin="5s"/>
    <animateMotion dur="16s" repeatCount="indefinite" begin="5s" path="M860,305 Q850,260 860,215 Q870,170 860,140"/>
    <rect x="-34" y="-11" width="68" height="22" rx="5" fill="#1b5e20" stroke="#2e7d32" stroke-width="0.6"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#a5d6a7" text-anchor="middle">PyTorch</text>
  </g>
  <g opacity="0.0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="12s" repeatCount="indefinite" begin="7s"/>
    <animateMotion dur="12s" repeatCount="indefinite" begin="7s" path="M120,310 Q130,270 120,230 Q110,190 120,160"/>
    <rect x="-28" y="-11" width="56" height="22" rx="5" fill="#4a148c" stroke="#7b1fa2" stroke-width="0.6"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#ce93d8" text-anchor="middle">Docker</text>
  </g>
  <g opacity="0.0">
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="13s" repeatCount="indefinite" begin="9s"/>
    <animateMotion dur="13s" repeatCount="indefinite" begin="9s" path="M780,305 Q770,265 780,225 Q790,185 780,155"/>
    <rect x="-26" y="-11" width="52" height="22" rx="5" fill="#b71c1c" stroke="#c62828" stroke-width="0.6"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#ef9a9a" text-anchor="middle">Redis</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#1565c0" stroke-width="1.2" fill="none" opacity="0.6">
    <polyline points="14,14 14,36 36,36"/>
    <polyline points="886,14 886,36 864,36"/>
    <polyline points="14,306 14,284 36,284"/>
    <polyline points="886,306 886,284 864,284"/>
  </g>

  <!-- ORCID / version watermark -->
  <text x="886" y="310" font-family="monospace" font-size="8" fill="#263238" text-anchor="end">v2.0 · SRMIST CSE AI&amp;ML</text>
</svg>
