<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020818"/>
      <stop offset="100%" stop-color="#0a0f2e"/>
    </linearGradient>
    <radialGradient id="tyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="tyBlur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="tyBlur2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="180" fill="url(#tyBg)" rx="14"/>
  <rect width="900" height="180" fill="url(#tyGlow)" rx="14"/>

  <!-- Grid -->
  <g stroke="#1a2a5e" stroke-width="0.4" opacity="0.3">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="225" y1="0" x2="225" y2="180"/>
    <line x1="450" y1="0" x2="450" y2="180"/>
    <line x1="675" y1="0" x2="675" y2="180"/>
  </g>

  <!-- Floating particles -->
  <g fill="#4fc3f7">
    <circle cx="80" cy="160" r="2"><animateMotion dur="6s" repeatCount="indefinite" path="M0,0 Q4,-50 0,-100 Q-4,-50 0,0"/><animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="170" r="1.5"><animateMotion dur="8s" repeatCount="indefinite" begin="1s" path="M0,0 Q-3,-60 0,-120 Q3,-60 0,0"/><animate attributeName="opacity" values="0;0.5;0" dur="8s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="700" cy="165" r="2"><animateMotion dur="7s" repeatCount="indefinite" begin="0.5s" path="M0,0 Q5,-55 0,-110 Q-5,-55 0,0"/><animate attributeName="opacity" values="0;0.6;0" dur="7s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="820" cy="160" r="1.5"><animateMotion dur="9s" repeatCount="indefinite" begin="2s" path="M0,0 Q-4,-65 0,-130 Q4,-65 0,0"/><animate attributeName="opacity" values="0;0.5;0" dur="9s" repeatCount="indefinite" begin="2s"/></circle>
    <circle cx="450" cy="170" r="2.5"><animateMotion dur="5s" repeatCount="indefinite" begin="1.5s" path="M0,0 Q6,-45 0,-90 Q-6,-45 0,0"/><animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite" begin="1.5s"/></circle>
  </g>
  <g fill="#ce93d8">
    <circle cx="330" cy="165" r="1.5"><animateMotion dur="7s" repeatCount="indefinite" begin="0.8s" path="M0,0 Q3,-50 0,-100 Q-3,-50 0,0"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="570" cy="170" r="2"><animateMotion dur="6s" repeatCount="indefinite" begin="2.5s" path="M0,0 Q-5,-55 0,-110 Q5,-55 0,0"/><animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite" begin="2.5s"/></circle>
  </g>

  <!-- Stars/sparkles -->
  <g fill="#ffe082">
    <text x="130" y="50" font-size="14" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/><animateMotion dur="2s" repeatCount="indefinite" path="M0,0 Q0,-10 0,0"/></text>
    <text x="750" y="45" font-size="12" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.8s"/></text>
    <text x="420" y="30" font-size="16" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="0.4s"/></text>
    <text x="60" y="90" font-size="10" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1s"/></text>
    <text x="840" y="80" font-size="11" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="0.6s"/></text>
  </g>

  <!-- Main THANK YOU text - floats up and pulses -->
  <g>
    <animateMotion dur="4s" repeatCount="indefinite" path="M0,0 Q0,-8 0,-14 Q0,-8 0,0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <!-- Glow -->
    <text x="450" y="88" font-family="'Courier New',monospace" font-size="44" font-weight="900"
          fill="#4fc3f7" text-anchor="middle" letter-spacing="6" filter="url(#tyBlur)" opacity="0.5">
      THANK YOU
    </text>
    <!-- Main -->
    <text x="450" y="88" font-family="'Courier New',monospace" font-size="44" font-weight="900"
          fill="#4fc3f7" text-anchor="middle" letter-spacing="6" filter="url(#tyBlur2)">
      THANK YOU
      <animate attributeName="fill" values="#4fc3f7;#81d4fa;#4fc3f7;#29b6f6;#4fc3f7" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Subtitle -->
  <g>
    <animateMotion dur="4s" begin="0.3s" repeatCount="indefinite" path="M0,0 Q0,-5 0,-9 Q0,-5 0,0"/>
    <text x="450" y="122" font-family="monospace" font-size="13" fill="#90caf9" text-anchor="middle" letter-spacing="1.5">
      for visiting my profile · let's connect &amp; build something incredible 🚀
    </text>
  </g>

  <!-- Bottom animated line -->
  <line x1="100" y1="148" x2="800" y2="148" stroke="#1565c0" stroke-width="0.8" opacity="0.5"
        stroke-dasharray="8,6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Corner brackets -->
  <g stroke="#1565c0" stroke-width="1" fill="none" opacity="0.5">
    <polyline points="12,12 12,28 28,28"/>
    <polyline points="888,12 888,28 872,28"/>
    <polyline points="12,168 12,152 28,152"/>
    <polyline points="888,168 888,152 872,152"/>
  </g>
</svg>
